name: keepmind
description: "KeepMind — capture something now so you don't have to remember it later."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^3.4.2

  # Local encrypted database
  drift: ^2.34.3
  sqlite3: ^3.0.0
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Secure secret storage (DB key, BYOK provider API keys)
  flutter_secure_storage: ^11.0.0

  # On-device OCR (Phase D)
  google_mlkit_text_recognition: ^0.16.0

  # Deterministic local reminders (Phase G)
  flutter_local_notifications: ^22.3.0
  timezone: ^0.10.0

  # Capture (Phase C)
  camera: ^0.11.0
  image_picker: ^1.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.34.3
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

# Encrypted SQLite (SQLite3MultipleCiphers instead of the deprecated
# sqlcipher_flutter_libs — see docs/DECISIONS.md, ADR-0002). This uses
# Dart's native-assets build hooks, which is a newer, still-evolving pub
# tooling feature — verify the exact current syntax against
# https://drift.simonbinder.eu/platforms/encryption/ locally before Phase B,
# since it could not be confirmed by running `flutter pub get` in this
# sandbox (no pub.dev access here — see README.md).
# hooks:
#   user_defines:
#     sqlite3:
#       source: sqlite3mc

# NOTE (Phase A skeleton): these version constraints were checked against
# pub.dev on 2026-08-13 (see docs/TECHNICAL_FOUNDATION_PLAN.md, section 13)
# but this sandbox could not reach pub.dev to run `flutter pub get` and
# resolve/lock exact versions. Run `flutter pub get` and `flutter pub
# outdated` locally before starting Phase B, and commit the resulting
# pubspec.lock at that point (pubspec.lock is intentionally NOT committed
# from this skeleton — see .gitignore — since it was never actually
# resolved against a real pub.dev index).
