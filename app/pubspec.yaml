name: keepmind
description: "KeepMind — capture something now so you don't have to remember it later."
publish_to: "none"
version: 0.1.0+1

environment:
  # flutter_riverpod 3.4.2 itself requires Dart ^3.12.0, and
  # DropdownButtonFormField.initialValue needs Flutter 3.35+. A lower
  # bound below these makes `flutter pub get` fail version solving.
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^3.4.2

  # Local encrypted database. sqlite3_flutter_libs is deliberately NOT
  # listed here: as of sqlite3 0.6.0+eol it "no longer does anything" —
  # the sqlite3 package now bundles native SQLite itself via Dart's
  # native-assets build hooks (same mechanism as the SQLite3MultipleCiphers
  # encryption setup below). See docs/DECISIONS.md ADR-0002.
  drift: ^2.34.3
  sqlite3: ^3.5.1
  path_provider: ^2.1.0
  path: ^1.9.0

  # Secure secret storage (DB key, BYOK provider API keys)
  flutter_secure_storage: ^11.0.0

  # On-device OCR (Phase D)
  google_mlkit_text_recognition: ^0.16.0

  # Deterministic local reminders (Phase G)
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0

  # Capture (Phase C). image_picker only — the `camera` package is
  # deliberately NOT used: image_picker hands off to the OS camera UI,
  # which avoids a controller/preview lifecycle and shrinks the
  # permissions and App Store review surface. See docs/DECISIONS.md
  # ADR-0005.
  image_picker: ^1.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.34.3
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

# Encrypted SQLite: bundles SQLite3MultipleCiphers instead of plain
# SQLite, which is what makes `PRAGMA key` in app_database.dart actually
# encrypt anything. Without this block the app still runs, but silently
# writes an UNENCRYPTED database (plain SQLite ignores PRAGMA key) and
# then trips the `_debugHasCipher` assert on first open. Verified against
# https://drift.simonbinder.eu/platforms/encryption/ — see ADR-0002.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

# NOTE: version constraints here were checked against individual pub.dev
# package pages, but this sandbox has never run an actual `flutter pub
# get` resolution against the real pub.dev index (no network access to it
# from here — see README.md). The first real `flutter pub get` on your
# machine caught one real mismatch already: `timezone: ^0.10.0` was too
# tight for `flutter_local_notifications: ^22.3.0`'s own `timezone:
# ^0.11.0` requirement, fixed above. Treat this file as "best effort, not
# resolver-verified" — further constraint mismatches may still surface the
# first time you run `flutter pub get`; paste the error back and I'll fix
# the specific constraint. Once it resolves cleanly, commit the resulting
# pubspec.lock (pubspec.lock is intentionally NOT committed from this
# skeleton — see .gitignore — since it was never actually resolved).
