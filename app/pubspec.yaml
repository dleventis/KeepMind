name: keepmind
description: "KeepMind — capture something now so you don't have to remember it later."
publish_to: "none"
version: 0.1.0+1

environment:
  # flutter_local_notifications 22.x requires Flutter 3.38.1+; riverpod
  # 3.4.2 requires Dart ^3.12.0. A lower bound below either lets
  # `flutter pub get` resolve on an SDK where the code will not compile.
  sdk: ^3.12.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  # State management / DI
  flutter_riverpod: ^3.4.2

  # Local encrypted database. sqlite3_flutter_libs is deliberately NOT
  # listed here: as of sqlite3 0.6.0+eol it "no longer does anything" —
  # the sqlite3 package now bundles native SQLite itself via Dart's
  # native-assets build hooks (same mechanism as the SQLite3MultipleCiphers
  # encryption setup below). See docs/DECISIONS.md ADR-0002.
  drift: ^2.34.3
  sqlite3: ^3.5.1
  path_provider: ^2.1.0
  path: ^1.9.0

  # Secure secret storage (DB key, BYOK provider API keys)
  flutter_secure_storage: ^11.0.0

  # On-device OCR (Phase D)
  google_mlkit_text_recognition: ^0.16.0

  # Deterministic local reminders (Phase G). flutter_timezone is required
  # because package:timezone deliberately does not detect the device's own
  # zone ("highly platform dependent and is not a goal of this package").
  # Without it tz.local falls back to UTC and every reminder fires at the
  # wrong civil hour.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0

  # Capture (Phase C). image_picker only — the `camera` package is
  # deliberately NOT used: image_picker hands off to the OS camera UI,
  # which avoids a controller/preview lifecycle and shrinks the
  # permissions and App Store review surface. See docs/DECISIONS.md
  # ADR-0005.
  image_picker: ^1.2.0

  # In-app purchases / entitlements (Phase K). Required by Shipaton,
  # which mandates the RevenueCat SDK power at least one real purchase.
  purchases_flutter: ^10.9.1

  # Opening the privacy policy / terms / subscription-management links
  # that App Store review requires to be reachable.
  url_launcher: ^6.3.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.34.3
  build_runner: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

# Encrypted SQLite: bundles SQLite3MultipleCiphers instead of plain
# SQLite, which is what makes `PRAGMA key` in app_database.dart actually
# encrypt anything. Without this block the app still runs, but silently
# writes an UNENCRYPTED database (plain SQLite ignores PRAGMA key) and
# then trips the `_debugHasCipher` assert on first open. Verified against
# https://drift.simonbinder.eu/platforms/encryption/ — see ADR-0002.
#
# This block has now been lost twice to a stale working copy. If it is
# ever missing, the database is not encrypted — treat that as a release
# blocker, not a nit.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
